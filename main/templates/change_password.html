<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>เปลี่ยนรหัสผ่าน - SecureLog</title>
  <link rel="icon" type="image/svg+xml" href="{{ static_url('favicon.svg') }}">

  <script src="{{ static_url('csrf.js') }}"></script>
  <script src="{{ static_url('session.js') }}"></script>
  <script defer src="{{ static_url('alpine.min.js') }}"></script>
  <link rel="stylesheet" href="{{ static_url('css/auth.css') }}">
  <style>
    :root {
      /* สองหน้านี้เป็น standalone (ไม่ extends base.html) จึงไม่ได้โหลด app.css —
         ประกาศ token ชุดเดียวกันไว้เองให้ auth.css ใช้ ค่าต้องตรงกับ app.css */
      --card-bg: #1d1e24;
      --bg-main: #141519;
      --bg-raised: #25262e;
      --border-color: #343741;
      --text-main: #dfe5ef;
      --text-muted: #98a2b3;
      --text-dim: #6a7280;
      --primary: #36a2ef;
      --primary-hover: #57b1f2;
      --danger: #f86b63;
      --danger-soft: rgba(248, 107, 99, 0.13);
      --danger-border: rgba(248, 107, 99, 0.42);
      --radius: 4px;
      --radius-lg: 6px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .wrap { width: 100%; max-width: 400px; }

    .brand h1 { font-size: 30px; font-weight: 800; color: var(--text-main); letter-spacing: -0.02em; }
    .brand p  { font-size: 13.5px; color: var(--text-muted); margin-top: 6px; font-weight: 500; }

    .warn {
      background: rgba(243, 211, 113, 0.13);
      border: 1px solid rgba(243, 211, 113, 0.42);
      color: #f3d371;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .field label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      background: var(--bg-raised);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 14.5px;
      color: var(--text-main);
      outline: none;
      transition: all .15s ease;
    }
    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }
    
    .field-hint { margin-top: 6px; font-size: 12px; color: var(--text-muted); }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%,75%  { transform: translateX(-6px); }
      50%      { transform: translateX(6px); }
    }

    .logout-link {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
    }
    .logout-link:hover { color: var(--text-main); text-decoration: underline; }
  </style>
</head>

<body>
  <div x-data="changePasswordApp()" class="wrap">

    <div class="brand">
      <h1>SecureLog</h1>
      <p>เปลี่ยนรหัสผ่าน</p>
    </div>

    <div class="card">
      <div class="warn">
        กรุณาตั้งรหัสผ่านใหม่
      </div>

      <div class="error" :class="{ show: error }" x-text="error"></div>
      <div :class="{ shake: shaking }">

        <div class="field">
          <label>รหัสผ่านใหม่</label>
          <input type="password"
                 x-model="newPassword"
                 @keydown.enter="submit"
                 :disabled="loading"
                 autocomplete="new-password"/>
          <div class="field-hint">อย่างน้อย 8 ตัวอักษร</div>
        </div>

        <div class="field">
          <label>ยืนยันรหัสผ่านใหม่</label>
          <input type="password"
                 x-model="confirmPassword"
                 @keydown.enter="submit"
                 :disabled="loading"
                 autocomplete="new-password"/>
        </div>

        <button class="btn"
                @click="submit"
                :disabled="loading || !canSubmit()">
          <span x-show="!loading">เปลี่ยนรหัสผ่าน</span>
          <template x-if="loading">
            <span style="display:flex;align-items:center;gap:8px">
              <div class="spinner"></div>
              กำลังบันทึก...
            </span>
          </template>
        </button>
      </div>

      <a class="logout-link" href="#" @click.prevent="logout()">ออกจากระบบแทน</a>
    </div>
  </div>

  <script>
    function changePasswordApp() {
      return {
        newPassword: '',
        confirmPassword: '',
        loading: false,
        error: '',
        shaking: false,

        canSubmit() {
          return this.newPassword.length >= 8 && this.confirmPassword
        },

        async submit() {
          if (this.loading) return

          if (!this.newPassword || !this.confirmPassword) {
            this.setError('กรุณากรอกข้อมูลให้ครบ')
            return
          }
          if (this.newPassword.length < 8) {
            this.setError('รหัสผ่านใหม่ต้องมีอย่างน้อย 8 ตัวอักษร')
            return
          }
          if (this.newPassword !== this.confirmPassword) {
            this.setError('ยืนยันรหัสผ่านใหม่ไม่ตรงกัน')
            return
          }

          this.loading = true
          this.error = ''

          try {
            const res = await fetch('/api/change-password', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                new_password: this.newPassword,
              }),
            })

            const data = await res.json()

            if (res.status === 429) throw new Error('ลองใหม่อีกครั้งในภายหลัง')
            if (!res.ok) throw new Error(data.detail || 'เปลี่ยนรหัสผ่านไม่สำเร็จ')

            window.location.href = '/dashboard'

          } catch (err) {
            this.setError(err.message)
          } finally {
            this.loading = false
          }
        },

        async logout() {
          await fetch('/api/logout', { method: 'POST' })
          window.location.href = '/login'
        },

        setError(msg) {
          this.error = msg
          this.shaking = true
          setTimeout(() => this.shaking = false, 350)
        }
      }
    }
  </script>
</body>
</html>
