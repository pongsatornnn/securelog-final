<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>เปลี่ยนรหัสผ่าน - SecureLog</title>
  <link rel="icon" type="image/svg+xml" href="{{ static_url('favicon.svg') }}">

  <script>
    // server บอก prefix มา = ใช้ค่านั้น · ไม่บอก (โหมด relative) = ถอดจาก URL ของหน้านี้เอง
    window.APP_BASE = "{{ base_path }}" || window.location.pathname.replace(/\/[^/]*$/, '');
    // ชื่อ cookie csrf คิดจาก prefix ด้วยกติกาเดียวกับฝั่ง server (base_path.py::_cookie_suffix)
    window.CSRF_COOKIE = "{{ csrf_cookie_name }}" || ('csrf_token' + (function (b) {
      var s = b.replace(/^\/+|\/+$/g, '').replace(/[^A-Za-z0-9_-]/g, '_').replace(/^_+|_+$/g, '');
      return s ? '_' + s : '';
    })(window.APP_BASE));
  </script>
  <script src="{{ static_url('csrf.js') }}"></script>
  <script src="{{ static_url('session.js') }}"></script>
  <script defer src="{{ static_url('alpine.min.js') }}"></script>
  <link rel="stylesheet" href="{{ static_url('css/auth.css') }}">
  <link rel="stylesheet" href="{{ static_url('css/change_password.css') }}">
  <link rel="stylesheet" href="{{ static_url('css/password_policy.css') }}">
</head>

<body>
  <div x-data="changePasswordApp()" class="wrap">

    <div class="brand">
      <h1>SecureLog</h1>
      <p>เปลี่ยนรหัสผ่าน</p>
    </div>

    <div class="card">
      <div class="warn">
        กรุณาตั้งรหัสผ่านใหม่
      </div>

      <div class="error" :class="{ show: error }" x-text="error"></div>
      <div :class="{ shake: shaking }">

        <div class="field">
          <label>รหัสผ่านใหม่</label>
          <input type="password"
                 x-model="newPassword"
                 @keydown.enter="submit"
                 :disabled="loading"
                 autocomplete="new-password"/>
          <div class="pw-check-title">รหัสผ่านต้องผ่านทุกข้อ</div>
          <ul class="pw-check">
            <template x-for="c in passwordChecks()" :key="c.id">
              <li :class="c.passed ? 'ok' : 'bad'">
                <span class="mark" x-text="c.passed ? '✓' : '✗'"></span>
                <span x-text="c.label"></span>
              </li>
            </template>
          </ul>
        </div>

        <div class="field">
          <label>ยืนยันรหัสผ่านใหม่</label>
          <input type="password"
                 x-model="confirmPassword"
                 @keydown.enter="submit"
                 :disabled="loading"
                 autocomplete="new-password"/>
        </div>

        <button class="btn"
                @click="submit"
                :disabled="loading || !canSubmit()">
          <span x-show="!loading">เปลี่ยนรหัสผ่าน</span>
          <template x-if="loading">
            <span style="display:flex;align-items:center;gap:8px">
              <div class="spinner"></div>
              กำลังบันทึก...
            </span>
          </template>
        </button>
      </div>

      <a class="logout-link" href="#" @click.prevent="logout()">ออกจากระบบแทน</a>
    </div>
  </div>

<script src="{{ static_url('js/password_policy.js') }}"></script>
  <script src="{{ static_url('js/change_password.js') }}"></script>
</body>
</html>
