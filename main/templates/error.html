<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ status_code }}</title>

  <link rel="icon" type="image/svg+xml" href="{{ static_url('favicon.svg') }}">
  <link rel="stylesheet" href="{{ static_url('css/app.css') }}">

  <style>
    /* หน้านี้ไม่ extends base.html เพราะต้องแสดงได้ทั้งตอนล็อกอินอยู่และตอนยังไม่ล็อกอิน
       (base.html ต้องมีตัวแปร user เสมอ) — แสดงแค่หมายเลข status ไม่บอกรายละเอียดอะไรเพิ่ม */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .error-code {
      font-size: 96px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--border-strong);
    }

    .error-code.is-server {
      color: var(--danger);
    }
  </style>
</head>

<body>
  <div class="error-code {% if status_code >= 500 %}is-server{% endif %}">{{ status_code }}</div>
</body>
</html>
