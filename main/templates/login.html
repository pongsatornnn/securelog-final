<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Login - SecureLog</title>
  <link rel="icon" type="image/svg+xml" href="{{ static_url('favicon.svg') }}">

  <script>
    // server บอก prefix มา = ใช้ค่านั้น · ไม่บอก (โหมด relative) = ถอดจาก URL ของหน้านี้เอง
    window.APP_BASE = "{{ base_path }}" || window.location.pathname.replace(/\/[^/]*$/, '');
    // ชื่อ cookie csrf คิดจาก prefix ด้วยกติกาเดียวกับฝั่ง server (base_path.py::_cookie_suffix)
    window.CSRF_COOKIE = "{{ csrf_cookie_name }}" || ('csrf_token' + (function (b) {
      var s = b.replace(/^\/+|\/+$/g, '').replace(/[^A-Za-z0-9_-]/g, '_').replace(/^_+|_+$/g, '');
      return s ? '_' + s : '';
    })(window.APP_BASE));
  </script>
  <script src="{{ static_url('csrf.js') }}"></script>
  <script defer src="{{ static_url('alpine.min.js') }}"></script>
  <link rel="stylesheet" href="{{ static_url('css/auth.css') }}">
  <link rel="stylesheet" href="{{ static_url('css/login.css') }}">
</head>

<body>
  <div x-data="loginApp()" class="wrap">

    <div class="brand">
      <h1>SecureLog</h1>
      <p>Threat Response System</p>
    </div>

    <div class="card">
      <div class="error" :class="{ show: error }" x-text="error"></div>
      <div :class="{ shake: shaking }">

        <div class="field">
          <label>ชื่อผู้ใช้</label>
          <input type="text"
                 x-model="username"
                 @keydown.enter="submit"
                 :disabled="loading"
                 autocomplete="username"/>
        </div>

        <div class="field">
          <label>รหัสผ่าน</label>
          <input type="password"
                 x-model="password"
                 @keydown.enter="submit"
                 :disabled="loading"
                 autocomplete="current-password"/>
        </div>
        
        <button class="btn"
                @click="submit"
                :disabled="loading || !username || !password">
          <span x-show="!loading">เข้าสู่ระบบ</span>
          <template x-if="loading">
            <span style="display:flex;align-items:center;gap:8px">
              <div class="spinner"></div>
              กำลังตรวจสอบ...
            </span>
          </template>
        </button>

      </div>
    </div>
  </div>

<script src="{{ static_url('js/login.js') }}"></script>

</body>
</html>
