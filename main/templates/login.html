<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Login - SecureLog</title>
  <link rel="icon" type="image/svg+xml" href="{{ static_url('favicon.svg') }}">

  <script src="{{ static_url('csrf.js') }}"></script>
  <script defer src="{{ static_url('alpine.min.js') }}"></script>
  <link rel="stylesheet" href="{{ static_url('css/auth.css') }}">
  <style>
    :root {
      /* สองหน้านี้เป็น standalone (ไม่ extends base.html) จึงไม่ได้โหลด app.css —
         ประกาศ token ชุดเดียวกันไว้เองให้ auth.css ใช้ ค่าต้องตรงกับ app.css */
      --card-bg: #1d1e24;
      --bg-main: #141519;
      --bg-raised: #25262e;
      --border-color: #343741;
      --text-main: #dfe5ef;
      --text-muted: #98a2b3;
      --text-dim: #6a7280;
      --primary: #36a2ef;
      --primary-hover: #57b1f2;
      --danger: #f86b63;
      --danger-soft: rgba(248, 107, 99, 0.13);
      --danger-border: rgba(248, 107, 99, 0.42);
      --radius: 4px;
      --radius-lg: 6px;
    }


    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .wrap { 
      width: 100%; 
      max-width: 380px; /* ปรับขนาดหน้าต่างให้สมดุลและดูหนักแน่นขึ้น */
    }

  /* === Brand โทนเดียวกับ Sidebar ด้านใน === */
    .brand h1 { 
      font-size: 30px; 
      font-weight: 800; 
      color: var(--text-main);
      letter-spacing: -0.02em; 
    }
    .brand p  { 
      font-size: 13.5px; 
      color: var(--text-muted);
      margin-top: 6px; 
      font-weight: 500;
    }

  /* === Card Style ปรับปรุงมิติและขอบมนให้เข้ากับชุดตารางด้านใน === */
    /* === Error Badge สไตล์ High Severity === */

  /* === Input Fields ปรับแต่งกรอบและ Focus State ให้สมูทขึ้น === */
    .field label { 
      display: block; 
      font-size: 13.5px; 
      font-weight: 600; 
      color: var(--text-muted);
      margin-bottom: 6px; 
    }
    .field input {
      width: 100%;
      background: var(--bg-raised);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 11px 14px;
      font-size: 14.5px;
      color: var(--text-main);
      outline: none;
      transition: all .15s ease;
    }
    .field input:focus { 
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }

  /* === ปุ่มกดสี Slate 900 ล้อไปกับธีมหลัก === */
    /* Animation ตัวหมุนโหลด */
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Animation เมื่อล็อกอินพลาด */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%,75%  { transform: translateX(-6px); }
      50%      { transform: translateX(6px); }
    }
    
  </style>
</head>

<body>
  <div x-data="loginApp()" class="wrap">

    <div class="brand">
      <h1>SecureLog</h1>
      <p>Threat Response System</p>
    </div>

    <div class="card">
      <div class="error" :class="{ show: error }" x-text="error"></div>
      <div :class="{ shake: shaking }">

        <div class="field">
          <label>ชื่อผู้ใช้</label>
          <input type="text"
                 x-model="username"
                 @keydown.enter="submit"
                 :disabled="loading"
                 autocomplete="username"/>
        </div>

        <div class="field">
          <label>รหัสผ่าน</label>
          <input type="password"
                 x-model="password"
                 @keydown.enter="submit"
                 :disabled="loading"
                 autocomplete="current-password"/>
        </div>
        
        <button class="btn"
                @click="submit"
                :disabled="loading || !username || !password">
          <span x-show="!loading">เข้าสู่ระบบ</span>
          <template x-if="loading">
            <span style="display:flex;align-items:center;gap:8px">
              <div class="spinner"></div>
              กำลังตรวจสอบ...
            </span>
          </template>
        </button>

      </div>
    </div>
  </div>

  <script>
    function loginApp() {
      return {
        username: '',     
        password: '',     
        loading : false,  
        error   : '',     
        shaking : false,  

        async submit() {
          if (this.loading) return

          if (!this.username || !this.password) {
            this.setError('กรุณากรอกข้อมูลให้ครบ')
            return
          }

          this.loading = true
          this.error   = ''

          try {
            const res = await fetch('/api/login', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
              },
              body: new URLSearchParams({
                username: this.username,
                password: this.password,
              }),
            })

            const data = await res.json()

            if (res.status === 429) throw new Error('ลองใหม่อีกครั้งในภายหลัง')
            if (!res.ok)           throw new Error(data.detail || 'เข้าสู่ระบบไม่สำเร็จ')

            window.location.href = '/dashboard'

          } catch (err) {
            this.setError(err.message)
          } finally {
            this.loading = false
          }
        },

        setError(msg) {
          this.error   = msg
          this.shaking = true
          setTimeout(() => this.shaking = false, 350)
        }
      }
    }
  </script>

</body>
</html>
